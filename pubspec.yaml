name: pixelplayer_flutter
description: PixelPlay, ported from the original Android application to Flutter.
publish_to: 'none'
version: 0.7.5-beta+75

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.9
  file_picker: ^11.0.2
  flutter_chrome_cast: ^1.4.6
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  path: ^1.9.1
  on_audio_query: ^2.9.0
  just_audio: ^0.10.6
  dynamic_color: ^1.8.1
  device_info_plus: ^12.4.0
  url_launcher: ^6.3.2
  id3: ^1.0.2
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.18
  audio_session: ^0.2.4
  material_color_utilities: ^0.13.0
  palette_generator: ^0.3.3+3
  google_sign_in: ^7.2.0
  wakelock_plus: ^1.5.2
  xml: ^6.6.1
  flutter_taglib: ^1.4.1
  romanize: ^0.0.3
  share_plus: ^12.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  on_audio_query_android:
    path: plugins/on_audio_query_android

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/THIRD_PARTY_NOTICES.md
  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/gflex_variable.ttf
    - family: Genre
      fonts:
        - asset: assets/fonts/genre_variable.ttf
